WarnAVX2Title=CPU 연산 래스터 · AVX2
WarnAVX2Body=Haswell세대 또는 그보다 새 CPU (2013년 및 그후)가 필요합니다,\n즉 AVX2 + FMA3를 지원하는 처리기입니다.\n\ni7 3세대 및 그보다 오래된것, Core2, 셀러론 J/N계렬 (일부)은 지원하지 않으며,\n선택하면 시작때 작동이 정지됩니다 (0xC000001D 불법 명령).\n\n확실하지 않으면 《SSE2 (모든 x64)》로 바꾸십시오 --\n느리지만 모든 64비트 CPU에서 실행됩니다.\n\n계속 배치하시겠습니까?\n\n(절망자만: 당신의 GPU가 DX9를 지원하면 CPU 연산 래스터를 사용하지 마십시오.)

WarnSSE2Title=CPU 연산 래스터 · SSE2
WarnSSE2Body=호환 모드: 모든 64비트 CPU에서 실행되며 AVX2가 필요없습니다.\n\nAVX2판보다 래스터 속도가 느립니다 (SIMD 일괄 혼합 없음),\n그러나 오래된 기계 (Nehalem / Westmere / Core2 등)는 이것만 사용할수 있습니다.\n\n만약 CPU가 AVX2를 지원하면 더 좋은 초당그림수를 위해 AVX2판으로 바꾸는것을 권합니다.\n\n계속 배치하시겠습니까?\n\n (절망자만: 당신의 GPU가 DX9를 지원하면 CPU 연산 래스터를 사용하지 마십시오.)