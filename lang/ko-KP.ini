; soku_config language file -- 조선어
; backends\lang\ 에 둔다. soku_loader.ini 의 Language= 로 고른다.
; 없으면 체계 언어로 자동 선택, 그것도 없으면 내장 중국어로 돌아간다.
;
; 형식: 키=값    (등호 좌우에 여백을 두지 말것)
; 줄바꿈은 \n 로 표시 (글자 그대로 반역슬라스 n)
;
; 현지화 작성자: DeepSeek
; 관리기 판본: 0.8.0

