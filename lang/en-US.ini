WarnAVX2Title=CPU raster · AVX2
WarnAVX2Body=Requires a Haswell-generation or newer CPU (2013 and later),\ni.e. a processor supporting AVX2 + FMA3.\n\ni7 3rd gen and older, Core2, and some Celeron J/N are not supported;\nselecting this will crash immediately on launch (0xC000001D illegal instruction).\n\nIf unsure, switch to "SSE2 (any x64)" --\nit is slower but runs on any 64-bit CPU.\n\nDeploy anyway?\n\n(For the desperate only: if your GPU supports DX9, do not use the CPU raster.)

WarnSSE2Title=CPU raster · SSE2
WarnSSE2Body=Compatibility mode: runs on any 64-bit CPU, no AVX2 needed.\n\nSlower than the AVX2 build (no SIMD batched blending),\nbut older machines (Nehalem / Westmere / Core2, etc.) can only use this.\n\nIf your CPU supports AVX2, switch to the AVX2 build for better frame rate.\n\nDeploy anyway?\n\n (For the desperate only: if your GPU supports DX9, do not use the CPU raster.)