WarnAVX2Title=CPU 軟光柵 · AVX2
WarnAVX2Body=需 Haswell 代或更新之 CPU（2013 年及後），\n即支持 AVX2 + FMA3 之處理器。\n\ni7 三代及更早、Core2、賽揚 J/N 系（部分）不支持，\n選之則啟動時直崩（0xC000001D 非法指令）。\n\n未審者請改用「SSE2 (任意 x64)」——\n其慢，然凡 64 位 CPU 皆可馳。\n\n續部署乎？\n\n(唯絕望者：若爾顯卡支持 DX9，勿用 CPU 軟光柵。)

WarnSSE2Title=CPU 軟光柵 · SSE2
WarnSSE2Body=兼容模式：凡 64 位 CPU 皆可馳，不須 AVX2。\n\n光柵速度遜於 AVX2 版（無 SIMD 批處理混合），\n然老機（Nehalem / Westmere / Core2 等）唯可用此。\n\n若 CPU 支持 AVX2，宜改 AVX2 版以得佳幀率。\n\n續部署乎？\n\n (唯絕望者：若爾顯卡支持 DX9，勿用 CPU 軟光柵。)