WarnAVX2Title=CPU raster · AVX2
WarnAVX2Body=Ye need a Haswell-generation CPU or newer (2013 and later),\ni.e. one that knows AVX2 + FMA3.\n\ni7 3rd gen and older, Core2, and some Celeron J/N ain't supported;\nchoose this and she'll crash right on launch (0xC000001D illegal instruction).\n\nIf ye ain't sure, pick "SSE2 (any x64)" instead --\nshe be slower, but any 64-bit CPU can sail her.\n\nDeploy anyway?\n\n(Only for the desperate: if yer GPU supports DX9, do NOT use the CPU raster.)

WarnSSE2Title=CPU raster · SSE2
WarnSSE2Body=Compatibility mode: any 64-bit CPU can sail her, no AVX2 needed.\n\nSlower than the AVX2 build (no SIMD batched blending),\nbut old vessels (Nehalem / Westmere / Core2, etc.) can only use this one.\n\nIf yer CPU knows AVX2, switch to the AVX2 build for a better frame rate.\n\nDeploy anyway?\n\n (Only for the desperate: if yer GPU supports DX9, do NOT use the CPU raster.)