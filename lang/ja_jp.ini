WarnAVX2Title=CPU ソフトラスタ · AVX2
WarnAVX2Body=Haswell 世代以降の CPU（2013 年以降）が必要です。\nつまり AVX2 + FMA3 対応プロセッサです。\n\ni7 第3世代以前、Core2、一部の Celeron J/N 系は非対応で、\n選択すると起動時に即クラッシュします（0xC000001D 不正命令）。\n\n不明な場合は「SSE2 (任意の x64)」を選んでください——\n遅いですが、任意の 64bit CPU で動作します。\n\nこのままデプロイしますか？\n\n（最後の手段：GPU が DX9 に対応しているなら、CPU ソフトラスタは使わないでください。）

WarnSSE2Title=CPU ソフトラスタ · SSE2
WarnSSE2Body=互換モード：任意の 64bit CPU で動作し、AVX2 は不要です。\n\nAVX2 版よりラスタ速度が遅くなります（SIMD バッチブレンドなし）。\n\nしかし古いマシン（Nehalem / Westmere / Core2 など）ではこれしか使えません。\n\nCPU が AVX2 に対応しているなら、より良いフレームレートのため AVX2 版を推奨します。\n\nこのままデプロイしますか？\n\n （最後の手段：GPU が DX9 に対応しているなら、CPU ソフトラスタは使わないでください。）